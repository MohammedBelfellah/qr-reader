<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff;
        }

        .container {
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #1f93ff 0%, #00d4ff 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #startBtn {
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1f93ff 0%, #00d4ff 100%);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(31, 147, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(31, 147, 255, 0.4);
        }

        #startBtn:active {
            transform: translateY(0);
        }

        #startBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            display: none;
            padding: 16px;
            background: rgba(31, 147, 255, 0.1);
            border: 1px solid rgba(31, 147, 255, 0.3);
            border-radius: 8px;
            gap: 12px;
            flex-direction: column;
            animation: slideIn 0.3s ease;
        }

        .result-container.show {
            display: flex;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(31, 147, 255, 0.8);
            font-weight: 600;
        }

        #urlResult {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #00d4ff;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-copy,
        .btn-open {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid rgba(31, 147, 255, 0.3);
            background: transparent;
            color: #00d4ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-copy:hover,
        .btn-open:hover {
            background: rgba(31, 147, 255, 0.1);
            border-color: rgba(31, 147, 255, 0.6);
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status.show {
            display: block;
        }

        .status.scanning {
            background: rgba(31, 147, 255, 0.1);
            border: 1px solid rgba(31, 147, 255, 0.3);
            color: #00d4ff;
        }

        .status.error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
        }

        .status.success {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: #2ed573;
        }

        .info {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">📱</div>
            <h1>QR Scanner</h1>
        </div>

        <button id="startBtn">Start Scanning</button>

        <div class="status" id="status"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-label">URL Found</div>
            <div id="urlResult"></div>
            <div class="action-buttons">
                <button class="btn-copy" id="copyBtn">Copy URL</button>
                <button class="btn-open" id="openBtn">Open Link</button>
            </div>
        </div>

        <div class="info">
            <strong>How to use:</strong><br>
            1. Click "Start Scanning"<br>
            2. Select an area on screen (like Google Lens)<br>
            3. The extension will scan for QR codes<br>
            4. Get the URL if a QR code is found
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
